<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- DAP daemon: AVRCP MediaPlayer1 (BT headphone transport controls) -->
  <policy user="pi">
    <allow own="org.pizero.dap"/>
    <allow receive_interface="org.bluez.MediaPlayer1"/>
    <allow receive_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_interface="org.freedesktop.DBus.Introspectable"/>
    <allow receive_interface="org.freedesktop.DBus.ObjectManager"/>
  </policy>
  <policy context="default">
    <allow send_interface="org.bluez.MediaPlayer1"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
  </policy>
</busconfig>
