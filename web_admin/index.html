<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DAP 管理画面</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; color: #17202a; background: #f1f4f7; }
    body { margin: 0; }
    header { background: #17324d; color: white; padding: 18px max(18px, calc((100vw - 980px) / 2)); }
    header h1 { margin: 0; font-size: 1.35rem; }
    main { max-width: 980px; margin: 18px auto; padding: 0 14px 30px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
    section { background: white; border: 1px solid #dce3e9; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px #1020300c; }
    section h2 { font-size: 1.08rem; margin: 0 0 12px; }
    .wide { grid-column: 1 / -1; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: .9rem; margin: 9px 0 4px; }
    input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 9px; border: 1px solid #aebbc7; border-radius: 7px; background: Canvas; color: CanvasText; }
    button, .button { display: inline-block; border: 0; border-radius: 7px; padding: 9px 13px; font: inherit; font-weight: 650; background: #1769aa; color: white; text-decoration: none; cursor: pointer; }
    button.secondary, .button.secondary { background: #526575; }
    button:disabled { opacity: .55; cursor: wait; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .muted { color: #5c6872; font-size: .88rem; }
    .message { min-height: 1.3em; margin: 9px 0 0; font-size: .9rem; }
    .error { color: #b42318; }
    .success { color: #16713b; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 9px; }
    .status-item { background: #f4f7f9; border-radius: 8px; padding: 10px; }
    .status-item small { display: block; color: #64727d; }
    .status-item strong { overflow-wrap: anywhere; }
    .qr-row { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
    #qr { width: 150px; height: 150px; image-rendering: pixelated; background: white; border: 1px solid #ddd; }
    .network-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e8edf1; background: #111820; }
      section { background: #1b2731; border-color: #34424d; }
      .status-item { background: #24323d; }
      .muted, .status-item small { color: #b4c0c9; }
      input, select { border-color: #53616d; }
    }
  </style>
</head>
<body>
  <header><h1>DAP 管理画面</h1></header>
  <main>
    <section class="wide">
      <h2>状態</h2>
      <div id="status" class="status-grid"><div class="status-item">読み込み中…</div></div>
      <p id="codec" class="muted"></p>
      <p id="status-message" class="message"></p>
    </section>

    <section>
      <h2>Wi-Fi接続先を追加</h2>
      <p class="muted">APモードをOFFにしてから検索・接続してください。追加したネットワークはNetworkManagerに保存されます。</p>
      <div class="network-row">
        <div><label for="networks">周辺のネットワーク</label><select id="networks"><option value="">検索してください</option></select></div>
        <button id="scan">検索</button>
      </div>
      <label for="wifi-password">パスワード（オープンネットワークは空欄）</label>
      <input id="wifi-password" type="password" autocomplete="new-password">
      <div class="actions"><button id="connect">このWi-Fiを追加して接続</button></div>
      <p id="wifi-message" class="message"></p>
    </section>

    <section>
      <h2>AP設定</h2>
      <div class="grid">
        <div><label for="ap-ssid">SSID</label><input id="ap-ssid" maxlength="32"></div>
        <div><label for="ap-password">パスワード</label><input id="ap-password" type="password" autocomplete="new-password"></div>
        <div><label for="ap-country">国コード</label><input id="ap-country" maxlength="2"></div>
        <div><label for="ap-channel">チャンネル</label><select id="ap-channel"></select></div>
      </div>
      <div class="actions"><button id="save-ap">AP設定を保存</button><button class="secondary" id="refresh-ap">再読込</button></div>
      <p class="muted">AP起動中に設定を変更した場合は、本体の接続設定からAPをOFF→ONにしてください。</p>
      <div class="qr-row"><img id="qr" alt="AP接続用Wi-Fi QRコード"><span class="muted">スマートフォンのカメラで読み取るとDAPのAPへ接続できます。</span></div>
      <p id="ap-message" class="message"></p>
    </section>

    <section class="wide">
      <h2>音楽ファイル</h2>
      <p>アップロードと削除はDUFSのファイル画面から行えます。</p>
      <div class="actions"><a class="button" href="/files/">DUFSを開く</a></div>
      <p class="muted">DUFSがポート8000で起動している必要があります。音楽フォルダーを開いて操作してください。</p>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    async function api(path, options = {}) {
      const response = await fetch(path, { cache: "no-store", ...options });
      const data = response.headers.get("content-type")?.includes("json") ? await response.json() : null;
      if (!response.ok) throw new Error(data?.error || `HTTP ${response.status}`);
      return data;
    }
    function message(id, text, kind = "") {
      const node = $(id); node.textContent = text; node.className = `message ${kind}`;
    }
    let lastApActive = null;
    function size(bytes) {
      let value = Number(bytes), unit = "B";
      for (const next of ["KB", "MB", "GB", "TB"]) { if (value < 1024) break; value /= 1024; unit = next; }
      return `${value.toFixed(1)} ${unit}`;
    }
    async function refreshStatus() {
      try {
        const s = await api("/api/status");
        if (lastApActive !== null && lastApActive !== s.ap_active) loadAp();
        lastApActive = s.ap_active;
        const battery = s.battery || "--%";
        const storage = s.storage ? `${size(s.storage.used)} / ${size(s.storage.total)} (${s.storage.percent}%)` : "取得できません";
        $("status").innerHTML = "";
        const devices = (s.bluetooth_devices || "").replace(/^Device\s+[0-9A-Fa-f:]{17}\s*/gm, "").trim() || "なし";
        for (const [label, value] of [["Wi-Fi", `${s.wifi_ssid} · ${s.wifi_ip}`], ["APモード", s.ap_active ? "ON" : "OFF"], ["バッテリー", battery], ["音楽ストレージ", storage], ["Bluetooth", `${s.bluetooth} · 無線 ${s.bluetooth_powered}`], ["接続中のBT機器", devices], ["BlueALSA", s.bluealsa]]) {
          const item = document.createElement("div"); item.className = "status-item";
          const small = document.createElement("small"); small.textContent = label;
          const strong = document.createElement("strong"); strong.textContent = value;
          item.append(small, strong); $("status").append(item);
        }
        $("codec").textContent = s.codec_info ? `Bluetooth音声状態: ${s.codec_info}` : "";
      } catch (error) { message("status-message", error.message, "error"); }
    }
    async function loadAp() {
      try {
        const ap = await api("/api/ap");
        $("ap-ssid").value = ap.ssid; $("ap-password").value = ap.password;
        $("ap-country").value = ap.country; $("ap-channel").value = String(ap.channel);
        $("qr").src = `/api/ap/qr.svg?t=${Date.now()}`;
        message("ap-message", ap.restart_required ? "AP設定に未反映の変更があります。OFF→ONで反映してください。" : `AP状態: ${ap.active ? "ON" : "OFF"}`);
      } catch (error) { message("ap-message", error.message, "error"); }
    }
    for (let channel = 1; channel <= 13; channel++) { const option = document.createElement("option"); option.value = channel; option.textContent = channel; $("ap-channel").append(option); }
    $("scan").onclick = async () => {
      $("scan").disabled = true; message("wifi-message", "検索しています…");
      try {
        const result = await api("/api/wifi/scan"); const select = $("networks"); select.replaceChildren();
        for (const network of result.networks) {
          const option = document.createElement("option"); option.value = network.ssid;
          option.textContent = `${network.ssid} · ${network.security || "オープン"} · ${network.signal}%`;
          option.dataset.security = network.security; select.append(option);
        }
        if (!result.networks.length) select.add(new Option("ネットワークが見つかりません", ""));
        message("wifi-message", `${result.networks.length}件のネットワークを検出しました`, "success");
      } catch (error) { message("wifi-message", error.message, "error"); }
      finally { $("scan").disabled = false; }
    };
    $("connect").onclick = async () => {
      const ssid = $("networks").value;
      if (!ssid) return message("wifi-message", "接続先を選択してください", "error");
      $("connect").disabled = true; message("wifi-message", "接続しています… SSH/ブラウザーが一時切断される場合があります");
      try {
        await api("/api/wifi/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ssid, password: $("wifi-password").value }) });
        for (let tries = 0; tries < 24; tries++) {
          await new Promise(resolve => setTimeout(resolve, 2500));
          const job = await api("/api/wifi/job");
          if (job.state !== "running") {
            if (job.state === "success") { $("wifi-password").value = ""; message("wifi-message", `${job.ssid}: ${job.message}`, "success"); }
            else message("wifi-message", job.message || "Wi-Fi接続に失敗しました", "error");
            break;
          }
        }
        refreshStatus();
      } catch (error) { message("wifi-message", error.message, "error"); }
      finally { $("connect").disabled = false; }
    };
    $("save-ap").onclick = async () => {
      try {
        const ap = await api("/api/ap", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ssid: $("ap-ssid").value, password: $("ap-password").value, country: $("ap-country").value, channel: $("ap-channel").value }) });
        $("qr").src = `/api/ap/qr.svg?t=${Date.now()}`;
        message("ap-message", ap.restart_required ? "保存しました。APをOFF→ONにすると新設定が反映されます。" : "保存しました。", "success");
      } catch (error) { message("ap-message", error.message, "error"); }
    };
    $("refresh-ap").onclick = loadAp;
    loadAp(); refreshStatus(); setInterval(refreshStatus, 10000);
  </script>
</body>
</html>
